name: Metrics

on:
  schedule:
    # Diario a las 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT (classic) con scope `repo`, guardado como secret METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          user: PurppleAlien
          filename: github-metrics.svg
          config_timezone: America/Mexico_City

          # Tema morado coherente con el perfil
          template: classic
          base: header, activity, community, repositories, metadata

          # Presentación general de la cuenta
          plugin_introduction: yes

          # Lenguajes con tamaño y porcentaje
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage

          # Calendario isométrico 3D del último año
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Hábitos de commit (actividad diaria/semanal)
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
